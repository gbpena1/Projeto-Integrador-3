<div class="container mt-5 mb-5">
  <h2 class="fw-bold mb-4">Carrinho de Compras</h2>
  <div class="row g-4">
    <div class="col-8">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <table class="table mb-0 align-middle">
            <thead class="bg-light">
              <tr>
                <th scope="col" class="ps-4 py-3 border-0">Produto</th>
                <th scope="col" class="py-3 border-0 text-center">Quantidade</th>
                <th scope="col" class="py-3 border-0 text-center">Preço</th>
                <th scope="col" class="py-3 border-0 text-center">Total</th>
                <th scope="col" class="py-3 border-0 text-center">Remover</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="ps-4 py-3">
                  <div class="d-flex align-items-center">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png" alt="Charizard VMAX" style="width: 60px; height: 60px; object-fit: contain;" class="me-3 bg-light rounded p-1">
                    <div>
                      <h6 class="mb-0 fw-bold">Charizard VMAX</h6>
                      <small class="text-muted">Rara Secreta</small>
                    </div>
                  </div>
                </td>
                <td class="py-3 text-center">
                  <div class="d-inline-flex border rounded">
                    <button class="btn btn-sm btn-light border-0 px-2">-</button>
                    <span class="px-3 py-1">1</span>
                    <button class="btn btn-sm btn-light border-0 px-2">+</button>
                  </div>
                </td>
                <td class="py-3 text-center">R$ 250,00</td>
                <td class="py-3 text-center fw-bold">R$ 250,00</td>
                <td class="py-3 text-center">
                  <button class="btn btn-sm btn-outline-danger">X</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="col-4">
      <div class="card border-0 shadow-sm bg-light">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-4">Resumo do Pedido</h5>
          <div class="d-flex justify-content-between mb-3">
            <span class="text-muted">Subtotal</span>
            <span>R$ 250,00</span>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <span class="text-muted">Frete</span>
            <span>R$ 15,00</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between mb-4">
            <span class="fw-bold">Total</span>
            <span class="fw-bold text-danger fs-5">R$ 265,00</span>
          </div>
          <button class="btn btn-danger btn-lg w-100 fw-bold py-3" routerLink="/checkout">Finalizar Compra</button>
        </div>
      </div>
    </div>
  </div>
</div>
