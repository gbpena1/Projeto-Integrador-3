<div class="container mt-5 mb-5">
  <h2 class="fw-bold mb-4">Finalizar Compra</h2>
  <div class="row g-4">
    <div class="col-8">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-4">Detalhes de Cobrança</h5>
          <form>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Sobrenome</label>
                <input type="text" class="form-control">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Endereço</label>
              <input type="text" class="form-control">
            </div>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label">Cidade</label>
                <input type="text" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">CEP</label>
                <input type="text" class="form-control">
              </div>
            </div>
            <h5 class="fw-bold mb-3 mt-4">Método de Pagamento</h5>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="paymentMethod" id="creditCard" checked>
              <label class="form-check-label" for="creditCard">Cartão de Crédito</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="paymentMethod" id="pix">
              <label class="form-check-label" for="pix">Pix</label>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="col-4">
      <div class="card border-0 shadow-sm bg-light">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-4">Resumo do Pedido</h5>
          <div class="d-flex justify-content-between mb-3">
            <span class="text-muted">Charizard VMAX (x1)</span>
            <span>R$ 250,00</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between mb-3">
            <span class="text-muted">Subtotal</span>
            <span>R$ 250,00</span>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <span class="text-muted">Frete</span>
            <span>R$ 15,00</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between mb-4">
            <span class="fw-bold">Total</span>
            <span class="fw-bold text-danger fs-5">R$ 265,00</span>
          </div>
          <button class="btn btn-danger btn-lg w-100 fw-bold py-3" routerLink="/success">Confirmar Pedido</button>
        </div>
      </div>
    </div>
  </div>
</div>
